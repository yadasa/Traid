name: Validate Forecast History UI

on:
  push:
    paths:
      - .github/workflows/validate-forecast-history-ui.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check dashboard/forecast-history-runtime.js
          node --check dashboard/live-first-loader.js

      - name: Validate runtime patch markers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('dashboard/app-loader.js', 'utf8');
          const wrapper = fs.readFileSync('dashboard/live-first-loader.js', 'utf8');
          const requiredLoaderMarkers = [
            "const loaderUrl = document.currentScript.src;",
            "  const digits = +quote.price > 1000 ? 2 : 4;",
            "  localStorage.setItem('traidChartType', state.chartType);\n}",
            "  state.lastStreamAt = 0;\n  resetProjectionHistory(); setFeed(false, 'Loading market and model…');",
            "    if (fit) chart.timeScale().fitContent();",
            "  renderRevision(revision);\n  return true;\n}",
            "  state.projectionHistory = []; state.renderedProjection = []; state.projectionAnimationFrame = null;\n}",
            "    renderPriorForecasts(); renderAccuracy(payload.accuracy);",
          ];
          for (const marker of requiredLoaderMarkers) {
            if (!loader.includes(marker)) throw new Error(`Missing app-loader marker: ${marker}`);
          }
          const requiredWrapperMarkers = [
            "forecast-history-runtime.js",
            "applyPriorPredictionVisibility();",
            "applyLockedPredictionVisibility();",
            "restoreLockedForecast(requestedSymbol, requestedTimeframe);",
            "refreshForecastHistoryControls();",
          ];
          for (const marker of requiredWrapperMarkers) {
            if (!wrapper.includes(marker)) throw new Error(`Missing wrapper marker: ${marker}`);
          }
          NODE

      - name: Remove one-time validator
        run: |
          rm .github/workflows/validate-forecast-history-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-forecast-history-ui.yml
          git commit -m "Remove completed forecast-history UI validator"
          git push origin HEAD:main
