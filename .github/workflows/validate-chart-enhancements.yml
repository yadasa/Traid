name: Validate Chart Enhancements

on:
  push:
    paths:
      - .github/workflows/validate-chart-enhancements.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check dashboard/live-first-loader.js
          node --check dashboard/chart-enhancements-runtime.js

      - name: Remove validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-chart-enhancements.yml
          git commit -m "Remove completed chart enhancement validator"
          git push origin HEAD:main
