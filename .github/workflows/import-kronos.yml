name: Import Kronos upstream

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-kronos.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Traid
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository contents with Kronos
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch master \
            https://github.com/shiyu-coder/Kronos.git \
            /tmp/kronos-upstream

          rsync -a --delete --exclude='.git' /tmp/kronos-upstream/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi

          git commit -m "Import Kronos source from shiyu-coder/Kronos"
          git push origin HEAD:main
