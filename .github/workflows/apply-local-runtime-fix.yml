name: Apply local runtime fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-local-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair runtime configuration and local Firebase wiring
        shell: bash
        run: |
          cat > traid_live/config.py <<'PY'
          from __future__ import annotations

          import os
          from dataclasses import dataclass

          from dotenv import load_dotenv


          load_dotenv()

          SUPPORTED_SYMBOLS = ("XAUUSD", "XAGUSD", "NAS100", "SPX500")


          def env_bool(name: str, default: bool = False) -> bool:
              return os.getenv(name, str(default)).strip().lower() in {"1", "true", "yes", "on"}


          @dataclass(frozen=True)
          class Settings:
              """Runtime configuration loaded from environment variables and an optional .env file."""

              provider: str = os.getenv("TRAID_PROVIDER", "mt5").lower()
              model_id: str = os.getenv("TRAID_MODEL_ID", "NeoQuasar/Kronos-small")
              tokenizer_id: str = os.getenv(
                  "TRAID_TOKENIZER_ID", "NeoQuasar/Kronos-Tokenizer-base"
              )
              model_device: str | None = os.getenv("TRAID_DEVICE") or None
              max_context: int = int(os.getenv("TRAID_MAX_CONTEXT", "512"))
              default_timeframe: str = os.getenv("TRAID_TIMEFRAME", "5m")
              default_lookback: int = int(os.getenv("TRAID_LOOKBACK", "400"))
              default_pred_len: int = int(os.getenv("TRAID_PRED_LEN", "24"))
              advanced_forecast_default: bool = env_bool(
                  "TRAID_ADVANCED_FORECAST_DEFAULT", False
              )
              uncertainty_paths: int = int(os.getenv("TRAID_UNCERTAINTY_PATHS", "7"))

              quote_poll_seconds: float = float(
                  os.getenv(
                      "TRAID_QUOTE_POLL_SECONDS",
                      os.getenv("TRAID_STREAM_POLL_SECONDS", "0.5"),
                  )
              )
              bar_poll_seconds: float = float(os.getenv("TRAID_BAR_POLL_SECONDS", "2"))

              database_path: str = os.getenv("TRAID_DATABASE_PATH", "data/traid.db")
              calendar_url: str | None = os.getenv("TRAID_CALENDAR_URL") or None
              calendar_refresh_minutes: int = int(
                  os.getenv("TRAID_CALENDAR_REFRESH_MINUTES", "15")
              )

              massive_api_key: str | None = os.getenv("MASSIVE_API_KEY")
              massive_base_url: str = os.getenv(
                  "MASSIVE_BASE_URL", "https://api.massive.com"
              )

              mt5_terminal_path: str | None = os.getenv("MT5_TERMINAL_PATH")
              mt5_login: int | None = (
                  int(os.environ["MT5_LOGIN"]) if os.getenv("MT5_LOGIN") else None
              )
              mt5_password: str | None = os.getenv("MT5_PASSWORD")
              mt5_server: str | None = os.getenv("MT5_SERVER")

              trading_enabled: bool = env_bool("TRAID_TRADING_ENABLED", False)
              trading_mode: str = os.getenv("TRAID_TRADING_MODE", "paper").lower()
              trading_api_key: str | None = os.getenv("TRAID_TRADING_API_KEY")
              trading_magic: int = int(os.getenv("TRAID_TRADING_MAGIC", "260731"))
              max_order_lots: float = float(os.getenv("TRAID_MAX_ORDER_LOTS", "1.0"))
              max_open_positions: int = int(os.getenv("TRAID_MAX_OPEN_POSITIONS", "4"))
              max_positions_per_symbol: int = int(
                  os.getenv("TRAID_MAX_POSITIONS_PER_SYMBOL", "1")
              )
              require_stop_loss: bool = env_bool("TRAID_REQUIRE_STOP_LOSS", True)
              trailing_poll_seconds: float = float(
                  os.getenv("TRAID_TRAILING_POLL_SECONDS", "0.5")
              )
              trailing_state_path: str = os.getenv(
                  "TRAID_TRAILING_STATE_PATH", "data/trailing_stops.json"
              )

              cors_origins: tuple[str, ...] = tuple(
                  value.strip()
                  for value in os.getenv("TRAID_CORS_ORIGINS", "*").split(",")
                  if value.strip()
              )

              def symbol_aliases(self) -> dict[str, str]:
                  defaults = {
                      "XAUUSD": "XAUUSD",
                      "XAGUSD": "XAGUSD",
                      "NAS100": "NAS100",
                      "SPX500": "SPX500",
                  }
                  return {
                      symbol: os.getenv(f"TRAID_{symbol}_SYMBOL", default)
                      for symbol, default in defaults.items()
                  }

              def validate(self) -> None:
                  if self.provider not in {"mt5", "massive"}:
                      raise ValueError("TRAID_PROVIDER must be either 'mt5' or 'massive'.")
                  if self.provider == "massive" and not self.massive_api_key:
                      raise ValueError(
                          "MASSIVE_API_KEY is required when TRAID_PROVIDER=massive."
                      )
                  if self.max_context < 2:
                      raise ValueError("TRAID_MAX_CONTEXT must be at least 2.")
                  if self.default_lookback < 2:
                      raise ValueError("TRAID_LOOKBACK must be at least 2.")
                  if self.default_pred_len < 1:
                      raise ValueError("TRAID_PRED_LEN must be at least 1.")
                  if not 3 <= self.uncertainty_paths <= 25:
                      raise ValueError("TRAID_UNCERTAINTY_PATHS must be between 3 and 25.")
                  if self.quote_poll_seconds < 0.1:
                      raise ValueError("TRAID_QUOTE_POLL_SECONDS must be at least 0.1.")
                  if self.bar_poll_seconds < 0.5:
                      raise ValueError("TRAID_BAR_POLL_SECONDS must be at least 0.5.")
                  if self.calendar_refresh_minutes < 1:
                      raise ValueError(
                          "TRAID_CALENDAR_REFRESH_MINUTES must be at least 1."
                      )
                  if self.trading_mode not in {"paper", "live"}:
                      raise ValueError("TRAID_TRADING_MODE must be 'paper' or 'live'.")
                  if self.trading_enabled and self.provider != "mt5":
                      raise ValueError(
                          "Live order execution currently requires TRAID_PROVIDER=mt5."
                      )
                  if self.trading_enabled and not self.trading_api_key:
                      raise ValueError(
                          "TRAID_TRADING_API_KEY is required whenever trading is enabled."
                      )
                  if self.max_order_lots <= 0:
                      raise ValueError("TRAID_MAX_ORDER_LOTS must be positive.")
                  if self.max_open_positions < 1 or self.max_positions_per_symbol < 1:
                      raise ValueError("Trading position limits must be at least 1.")
                  if self.trailing_poll_seconds < 0.1:
                      raise ValueError(
                          "TRAID_TRAILING_POLL_SECONDS must be at least 0.1."
                      )
          PY

          cat > .env.example <<'ENV'
          # Data provider: mt5 (recommended for broker-exact CFD prices) or massive
          TRAID_PROVIDER=mt5

          # Kronos model configuration
          TRAID_MODEL_ID=NeoQuasar/Kronos-small
          TRAID_TOKENIZER_ID=NeoQuasar/Kronos-Tokenizer-base
          TRAID_MAX_CONTEXT=512
          TRAID_TIMEFRAME=5m
          TRAID_LOOKBACK=400
          TRAID_PRED_LEN=24
          TRAID_ADVANCED_FORECAST_DEFAULT=false
          TRAID_UNCERTAINTY_PATHS=7
          # TRAID_DEVICE=cuda:0

          # Local persistence and optional economic calendar JSON feed
          TRAID_DATABASE_PATH=data/traid.db
          # TRAID_CALENDAR_URL=https://example.com/calendar.json
          TRAID_CALENDAR_REFRESH_MINUTES=15

          # Live feed cadence. MT5 can remain sub-second; cloud REST snapshots are throttled by the app.
          TRAID_QUOTE_POLL_SECONDS=0.5
          TRAID_BAR_POLL_SECONDS=2

          # Exact broker symbols. Change these when your broker uses suffixes such as .a, -ECN, or _pro.
          TRAID_XAUUSD_SYMBOL=XAUUSD
          TRAID_XAGUSD_SYMBOL=XAGUSD
          TRAID_NAS100_SYMBOL=NAS100
          TRAID_SPX500_SYMBOL=SPX500

          # Optional MT5 connection values. Leave blank to use the terminal's active account.
          # Never expose these values in dashboard JavaScript or commit a real .env file.
          # MT5_TERMINAL_PATH=C:\\Program Files\\MetaTrader 5\\terminal64.exe
          # MT5_LOGIN=12345678
          # MT5_PASSWORD=replace_me
          # MT5_SERVER=Broker-Server

          # Private local operator login used for account/trading endpoints.
          TRAID_ADMIN_USER=admin
          TRAID_ADMIN_PASSWORD=change_this_local_password
          TRAID_SESSION_TTL_SECONDS=28800
          # Prefer TRAID_ADMIN_PASSWORD_HASH instead of plaintext after initial setup.
          # TRAID_ADMIN_PASSWORD_HASH=pbkdf2_sha256$...

          # Trade execution safety. Keep paper mode until a demo account has been validated.
          TRAID_TRADING_ENABLED=false
          TRAID_TRADING_MODE=paper
          # Generate a long random secret before enabling trading.
          # TRAID_TRADING_API_KEY=replace_with_a_long_random_secret
          TRAID_TRADING_MAGIC=260731
          TRAID_MAX_ORDER_LOTS=1.0
          TRAID_MAX_OPEN_POSITIONS=4
          TRAID_MAX_POSITIONS_PER_SYMBOL=1
          TRAID_REQUIRE_STOP_LOSS=true
          TRAID_TRAILING_POLL_SECONDS=0.5
          TRAID_TRAILING_STATE_PATH=data/trailing_stops.json

          # Massive cloud fallback
          # MASSIVE_API_KEY=replace_me
          MASSIVE_BASE_URL=https://api.massive.com

          # Comma-separated frontend origins. These local defaults cover both dashboard launch methods.
          TRAID_CORS_ORIGINS=http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5000,http://localhost:5000
          ENV

          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard/firebase-auth.js')
          text = path.read_text(encoding='utf-8')
          old = """  const auth = authModule.getAuth(app);
            const db = firestoreModule.getFirestore(app);
            await authModule.setPersistence(auth, authModule.browserLocalPersistence);"""
          new = """  const auth = authModule.getAuth(app);
            const db = firestoreModule.getFirestore(app);
            const localHostnames = new Set(['localhost', '127.0.0.1', '::1']);
            const query = new URLSearchParams(window.location.search);
            const useFirebaseEmulators = localHostnames.has(window.location.hostname)
              && (window.location.port === '5000' || query.get('firebaseEmulator') === '1');
            if (useFirebaseEmulators) {
              authModule.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
              firestoreModule.connectFirestoreEmulator(db, '127.0.0.1', 8080);
              setMessage('Connected to local Firebase Auth and Firestore emulators.');
            }
            await authModule.setPersistence(auth, authModule.browserLocalPersistence);"""
          if old not in text:
              raise SystemExit('Could not find Firebase initialization block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('FIREBASE.md')
          content = docs.read_text(encoding='utf-8')
          old_docs = """Open the Hosting emulator URL, normally `http://127.0.0.1:5000`."""
          new_docs = """Open the Hosting emulator URL, normally `http://127.0.0.1:5000`. The dashboard automatically connects to Auth on port `9099` and Firestore on port `8080` when opened through that Hosting emulator. If you intentionally serve the dashboard on another localhost port, append `?firebaseEmulator=1`."""
          if old_docs in content:
              docs.write_text(content.replace(old_docs, new_docs, 1), encoding='utf-8')

          tests = Path('tests/test_platform.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_local_runtime_settings_contracts()'
          block = '''\n\ndef test_local_runtime_settings_contracts() -> None:\n    from traid_live.config import Settings\n\n    settings = Settings()\n    assert settings.database_path\n    assert settings.calendar_refresh_minutes >= 1\n    assert 3 <= settings.uncertainty_paths <= 25\n\n    root = Path(__file__).resolve().parents[1]\n    firebase_auth = (root / "dashboard" / "firebase-auth.js").read_text(encoding="utf-8")\n    assert "connectAuthEmulator" in firebase_auth\n    assert "connectFirestoreEmulator" in firebase_auth\n'''
          if marker not in test_text:
              tests.write_text(test_text.rstrip() + block + '\n', encoding='utf-8')
          PY

          python -m compileall -q traid_live
          node --check dashboard/firebase-auth.js
          python -m pytest -q

          git rm .github/workflows/apply-local-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traid_live/config.py .env.example dashboard/firebase-auth.js FIREBASE.md tests/test_platform.py
          git commit -m "Fix local runtime settings and Firebase emulator routing"
          git push origin HEAD:main
