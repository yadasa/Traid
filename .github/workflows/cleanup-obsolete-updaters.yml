name: Cleanup obsolete Traid updaters

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-updaters.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-forecast-history.yml
          rm -f .github/workflows/cleanup-obsolete-updaters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete one-time updater"
          git push origin HEAD:main
