name: Validate Live Priority and Forex

on:
  push:
    paths:
      - .github/workflows/validate-live-priority-and-forex.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            traid_live/config.py \
            traid_live/market.py \
            traid_live/live_priority_runtime.py \
            traid_live/final_runtime.py

      - name: Validate dashboard JavaScript
        run: node --check dashboard/live-first-loader.js

      - name: Remove one-time validator
        shell: bash
        run: rm .github/workflows/validate-live-priority-and-forex.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-live-priority-and-forex.yml
          git commit -m "Remove completed live-priority validator"
          git push origin HEAD:main
