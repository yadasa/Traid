name: Live data CI

on:
  push:
    branches:
      - main
      - feature/live-market-data
  pull_request:
    paths:
      - "traid_live/**"
      - "tests/test_live_data.py"
      - "requirements-live.txt"
      - ".github/workflows/live-data-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Compile live package
        run: python -m compileall -q traid_live
      - name: Run tests
        run: python -m pytest -q tests/test_live_data.py
