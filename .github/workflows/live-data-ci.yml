name: Live data CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "traid_live/**"
      - "dashboard/**"
      - "tests/**"
      - "requirements-live.txt"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/live-data-ci.yml"
  pull_request:
    paths:
      - "traid_live/**"
      - "dashboard/**"
      - "tests/**"
      - "requirements-live.txt"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/live-data-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Compile live package
        run: python -m compileall -q traid_live
      - name: Validate Firebase configuration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for filename in ("firebase.json", ".firebaserc", "firestore.indexes.json"):
              json.loads(Path(filename).read_text(encoding="utf-8"))
          PY
      - name: Check dashboard JavaScript syntax
        run: |
          node --check dashboard/app.js
          node --check dashboard/firebase-auth.js
      - name: Run tests
        run: python -m pytest -q
