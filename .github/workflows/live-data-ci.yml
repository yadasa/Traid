name: Live data CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    paths:
      - "traid_live/**"
      - "dashboard/**"
      - "tests/test_live_data.py"
      - "requirements-live.txt"
      - ".github/workflows/live-data-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Compile live package
        run: python -m compileall -q traid_live
      - name: Check dashboard JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("/tmp/traid-dashboard.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/traid-dashboard.js
      - name: Run tests
        run: python -m pytest -q tests/test_live_data.py
