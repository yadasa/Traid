name: Validate Locked Forecasts and Live Colors

on:
  push:
    paths:
      - .github/workflows/validate-locks-live-colors.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check dashboard/forecast-history-runtime.js
          node --check dashboard/chart-scale-runtime.js
          node --check dashboard/live-first-loader.js

      - name: Validate runtime markers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appLoader = fs.readFileSync('dashboard/app-loader.js', 'utf8');
          const locks = fs.readFileSync('dashboard/forecast-history-runtime.js', 'utf8');
          const scale = fs.readFileSync('dashboard/chart-scale-runtime.js', 'utf8');
          const wrapper = fs.readFileSync('dashboard/live-first-loader.js', 'utf8');

          const checks = [
            [locks, 'const MAX_LOCKED_FORECASTS = 20;'],
            [locks, '.slice(-MAX_LOCKED_FORECASTS);'],
            [locks, 'let lockedForecastStyleFrame = null;'],
            [locks, 'function animateLockedForecastStyle(target) {'],
            [locks, 'installForecastHistoryControls();\nrestoreLockedForecast(state.symbol, state.timeframe);\napplyPriorPredictionVisibility();'],
            [scale, 'function updateLiveDirectionVisual(row = null, quote = null) {'],
            [scale, "body: '#2dd4bf'"],
            [scale, "body: '#d9467d'"],
            [wrapper, 'const liveCandleMarker ='],
            [wrapper, 'const livePriceLineMarker ='],
            [appLoader, "liveCandles.setData([toCandle(row)]); liveLine.setData([toLine(row)]);"],
            [appLoader, "color: '#22d3ee'"],
          ];
          for (const [source, marker] of checks) {
            if (!source.includes(marker)) throw new Error(`Missing runtime marker: ${marker}`);
          }
          NODE

      - name: Remove one-time validator
        run: |
          rm .github/workflows/validate-locks-live-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-locks-live-colors.yml
          git commit -m "Remove completed lock and live-color validator"
          git push origin HEAD:main
