name: Install Live-First Dashboard Loader

on:
  push:
    paths:
      - .github/workflows/install-live-first-loader.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch dashboard loader
        shell: python
        run: |
          from pathlib import Path

          index = Path("dashboard/index.html")
          source = index.read_text(encoding="utf-8")
          old = '<script src="./app-loader.js"></script>'
          new = '<script src="./live-first-loader.js"></script>'
          if old not in source and new not in source:
              raise SystemExit("Dashboard loader marker was not found.")
          if old in source:
              source = source.replace(old, new, 1)
              index.write_text(source, encoding="utf-8")

          Path(".github/workflows/install-live-first-loader.yml").unlink()

      - name: Validate JavaScript
        run: node --check dashboard/live-first-loader.js

      - name: Commit loader switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/live-first-loader.js .github/workflows/install-live-first-loader.yml
          git commit -m "Connect live market stream before forecasting"
          git push origin HEAD:main
