name: Fix dashboard controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dashboard-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch resilient dashboard startup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('dashboard/index.html')
          html = index.read_text(encoding='utf-8')
          old_script = '<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>'
          new_script = '''<script
    src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"
    onerror="this.onerror=null;this.src='https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js';">
  </script>'''
          if old_script not in html:
              if 'lightweight-charts@5.2.0' not in html:
                  raise SystemExit('Could not find chart library script in dashboard/index.html')
          else:
              html = html.replace(old_script, new_script, 1)
          index.write_text(html, encoding='utf-8')

          app = Path('dashboard/app.js')
          js = app.read_text(encoding='utf-8')

          chart_marker = "const chart = LightweightCharts.createChart($('chart'), {"
          startup = """let uiWired = false;
wireUI();

if (!window.LightweightCharts) {
  setFeed(false, 'Chart library did not load');
  toast('The chart library could not be loaded. Settings and login still work; check your internet connection or browser extensions, then refresh.', 'error');
  throw new Error('LightweightCharts failed to load from both configured CDNs.');
}

const chart = LightweightCharts.createChart($('chart'), {"""
          if chart_marker in js and 'let uiWired = false;' not in js:
              js = js.replace(chart_marker, startup, 1)
          elif 'let uiWired = false;' not in js:
              raise SystemExit('Could not find chart initialization in dashboard/app.js')

          wire_marker = "function wireUI(){\n  $('symbolSelect').value=state.symbol;"
          wire_replacement = "function wireUI(){\n  if (uiWired) return;\n  uiWired = true;\n  $('symbolSelect').value=state.symbol;"
          if wire_marker in js:
              js = js.replace(wire_marker, wire_replacement, 1)
          elif 'if (uiWired) return;' not in js:
              raise SystemExit('Could not find wireUI function in dashboard/app.js')

          app.write_text(js, encoding='utf-8')

          tests = Path('tests/test_platform.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_dashboard_resilient_startup_contracts()'
          block = '''\n\ndef test_dashboard_resilient_startup_contracts() -> None:\n    root = Path(__file__).resolve().parents[1]\n    html = (root / "dashboard" / "index.html").read_text(encoding="utf-8")\n    js = (root / "dashboard" / "app.js").read_text(encoding="utf-8")\n    assert "lightweight-charts@5.2.0" in html\n    assert "cdn.jsdelivr.net" in html\n    assert "unpkg.com/lightweight-charts@5.2.0" in html\n    assert js.index("wireUI();") < js.index("LightweightCharts.createChart")\n    assert "if (uiWired) return;" in js\n    assert "Chart library did not load" in js\n'''
          if marker not in text:
              tests.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

          node --check dashboard/app.js
          python -m pytest -q

          git rm .github/workflows/fix-dashboard-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/app.js tests/test_platform.py
          git commit -m "Make dashboard controls resilient to chart load failures"
          git push origin HEAD:main
