name: Validate ICT Forecast Runtime

on:
  push:
    paths:
      - .github/workflows/validate-ict-runtime.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            traid_live/ict_context.py \
            traid_live/ict_runtime.py \
            traid_live/final_runtime.py

      - name: Validate dashboard JavaScript
        run: node --check dashboard/ict-ui-runtime.js

      - name: Run deterministic ICT tests
        run: |
          python -m pip install --quiet pandas numpy pytest
          pytest -q tests/test_ict_context.py

      - name: Remove one-time validator
        run: |
          rm .github/workflows/validate-ict-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-ict-runtime.yml
          git commit -m "Remove completed ICT runtime validator"
          git push origin HEAD:main
