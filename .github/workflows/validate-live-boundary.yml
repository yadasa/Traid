name: Validate Live Candle Boundary

on:
  push:
    paths:
      - .github/workflows/validate-live-boundary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python -m py_compile traid_live/live_priority_runtime.py
      - run: node --check dashboard/live-first-loader.js
      - run: rm .github/workflows/validate-live-boundary.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-live-boundary.yml
          git commit -m "Remove completed live boundary validator"
          git push origin HEAD:main
