name: Patch local Firebase emulator routing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-firebase-emulator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect local dashboard to Auth and Firestore emulators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard/firebase-auth.js')
          text = path.read_text(encoding='utf-8')
          old = """  const auth = authModule.getAuth(app);
            const db = firestoreModule.getFirestore(app);
            await authModule.setPersistence(auth, authModule.browserLocalPersistence);"""
          new = """  const auth = authModule.getAuth(app);
            const db = firestoreModule.getFirestore(app);
            const localHostnames = new Set(['localhost', '127.0.0.1', '::1']);
            const query = new URLSearchParams(window.location.search);
            const useFirebaseEmulators = localHostnames.has(window.location.hostname)
              && (window.location.port === '5000' || query.get('firebaseEmulator') === '1');
            if (useFirebaseEmulators) {
              authModule.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
              firestoreModule.connectFirestoreEmulator(db, '127.0.0.1', 8080);
              setMessage('Connected to local Firebase Auth and Firestore emulators.');
            }
            await authModule.setPersistence(auth, authModule.browserLocalPersistence);"""
          if old not in text:
              if 'connectAuthEmulator' not in text:
                  raise SystemExit('Could not find Firebase initialization block')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('FIREBASE.md')
          content = docs.read_text(encoding='utf-8')
          old_docs = "Open the Hosting emulator URL, normally `http://127.0.0.1:5000`."
          new_docs = "Open the Hosting emulator URL, normally `http://127.0.0.1:5000`. The dashboard automatically connects to Auth on port `9099` and Firestore on port `8080` when opened through that Hosting emulator. If you intentionally serve the dashboard on another localhost port, append `?firebaseEmulator=1`."
          if old_docs in content:
              docs.write_text(content.replace(old_docs, new_docs, 1), encoding='utf-8')
          PY
          node --check dashboard/firebase-auth.js
          git rm .github/workflows/patch-firebase-emulator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/firebase-auth.js FIREBASE.md
          git commit -m "Connect local dashboard to Firebase emulators"
          git push origin HEAD:main
